version: "3.9"

services:
  backend:
    build: ./backend
    container_name: notes-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/notes.txt:/app/notes.txt
    networks:
      - notes-network

  frontend:
    build: ./frontend
    container_name: notes-frontend
    ports:
      - "3001:80"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - notes-network

networks:
  notes-network:
    driver: bridge
